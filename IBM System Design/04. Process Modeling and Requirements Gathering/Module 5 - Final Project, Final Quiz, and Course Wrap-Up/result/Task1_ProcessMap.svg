<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="1060" height="45" rx="6" fill="#1e293b" />
  <text x="550" y="43" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Process Map: Request Defective Auto Part Replacement (Cross-Functional Swimlane)</text>

  <!-- Swimlane Headers -->
  <!-- Lane 1: Customer -->
  <rect x="20" y="70" width="180" height="230" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
  <text x="110" y="190" text-anchor="middle" fill="#0369a1" font-size="16" font-weight="bold">Customer</text>
  <rect x="200" y="70" width="880" height="230" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Lane 2: Store Clerk -->
  <rect x="20" y="300" width="180" height="240" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" />
  <text x="110" y="425" text-anchor="middle" fill="#a16207" font-size="16" font-weight="bold">Store Clerk</text>
  <rect x="200" y="300" width="880" height="240" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Lane 3: Inventory System -->
  <rect x="20" y="540" width="180" height="280" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" />
  <text x="110" y="675" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="bold">Store &amp; Inventory System</text>
  <rect x="200" y="540" width="880" height="280" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Step 0: Start -->
  <ellipse cx="260" cy="130" rx="40" ry="22" fill="#dcfce7" stroke="#15803d" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="135" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">Start</text>

  <!-- S01: Customer Requests Service -->
  <rect x="330" y="105" width="120" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="126" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S01: Contact Store</text>
  <text x="390" y="142" text-anchor="middle" fill="#475569" font-size="10">Report defect claim</text>

  <!-- S02: Provides purchase details -->
  <rect x="475" y="105" width="125" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="537" y="126" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S02: Submit Details</text>
  <text x="537" y="142" text-anchor="middle" fill="#475569" font-size="10">Order # / receipt</text>

  <!-- Decision 1: Purchase Valid? -->
  <polygon points="537,565 597,605 537,645 477,605" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="537" y="601" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">D1: Purchase</text>
  <text x="537" y="614" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">Valid?</text>

  <!-- Alt Flow A2: Purchase cannot be verified -->
  <rect x="320" y="340" width="130" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="361" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">A2.1: Deny Request</text>
  <text x="385" y="377" text-anchor="middle" fill="#7f1d1d" font-size="9.5">Advise proof required</text>

  <rect x="320" y="210" width="130" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="230" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="bold">A2.2: Receive Denial</text>
  <text x="385" y="244" text-anchor="middle" fill="#7f1d1d" font-size="9">Understand policy</text>

  <ellipse cx="250" cy="232" rx="32" ry="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="250" y="236" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="bold">End [A2]</text>

  <!-- S03 & S04: Verify Defect Claim -->
  <rect x="625" y="340" width="130" height="50" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="361" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S04: Inspect Part</text>
  <text x="690" y="377" text-anchor="middle" fill="#475569" font-size="9.5">Physical / photo audit</text>

  <!-- Decision 2: Defect Valid vs Misuse? -->
  <polygon points="690,565 750,605 690,645 630,605" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="601" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">D2: Mfg</text>
  <text x="690" y="614" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">Defect?</text>

  <!-- Alt Flow A3: Signs of misuse -->
  <rect x="475" y="340" width="130" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="361" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">A3.1: Reject Request</text>
  <text x="540" y="377" text-anchor="middle" fill="#7f1d1d" font-size="9.5">Misuse / damage noted</text>

  <rect x="475" y="210" width="130" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="230" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="bold">A3.2: Rejection Notice</text>
  <text x="540" y="244" text-anchor="middle" fill="#7f1d1d" font-size="9">Policy limitations</text>

  <ellipse cx="635" cy="232" rx="32" ry="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="635" y="236" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="bold">End [A3]</text>

  <!-- S05: System checks inventory -->
  <rect x="775" y="580" width="125" height="50" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="837" y="601" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S05: Check Inventory</text>
  <text x="837" y="617" text-anchor="middle" fill="#475569" font-size="9.5">Lookup identical SKU</text>

  <!-- Decision 3: In Stock? -->
  <polygon points="837,680 897,715 837,750 777,715" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="837" y="711" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">D3: In Stock?</text>
  <text x="837" y="724" text-anchor="middle" fill="#854d0e" font-size="9">(Available)</text>

  <!-- Alt Flow A1: Out of stock -->
  <rect x="630" y="690" width="125" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="692" y="710" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="bold">A1.1: Offer Options</text>
  <text x="692" y="725" text-anchor="middle" fill="#78350f" font-size="9">Refund / Credit / Back-order</text>

  <rect x="630" y="450" width="125" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="692" y="470" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="bold">A1.2: Execute Choice</text>
  <text x="692" y="484" text-anchor="middle" fill="#78350f" font-size="9">Issue Refund/Back-order</text>

  <ellipse cx="692" cy="180" rx="35" ry="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="692" y="184" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">End [A1]</text>

  <!-- S06: Replacement is issued -->
  <rect x="930" y="340" width="130" height="50" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="995" y="361" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S06: Handover Part</text>
  <text x="995" y="377" text-anchor="middle" fill="#475569" font-size="9.5">Clerk issues new item</text>

  <rect x="930" y="105" width="130" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="995" y="126" text-anchor="middle" fill="#14532d" font-size="11" font-weight="bold">S06.2: Receive Part</text>
  <text x="995" y="142" text-anchor="middle" fill="#166534" font-size="9.5">Customer gets item</text>

  <!-- S07: Confirmation provided -->
  <rect x="930" y="580" width="130" height="50" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="995" y="601" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">S07: System Receipt</text>
  <text x="995" y="617" text-anchor="middle" fill="#475569" font-size="9.5">Generate record/email</text>

  <rect x="930" y="210" width="130" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="995" y="230" text-anchor="middle" fill="#14532d" font-size="10.5" font-weight="bold">S07.2: Get Confirmation</text>
  <text x="995" y="244" text-anchor="middle" fill="#166534" font-size="9">Receipt or email</text>

  <ellipse cx="995" cy="280" rx="35" ry="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="995" y="284" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">End [Success]</text>

  <!-- CONNECTORS -->
  <!-- Start -> S01 -->
  <path d="M 300 130 L 330 130" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- S01 -> S02 -->
  <path d="M 450 130 L 475 130" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- S02 -> D1 -->
  <path d="M 537 155 L 537 565" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- D1 No -> A2.1 -->
  <path d="M 477 605 L 385 605 L 385 390" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="430" y="598" fill="#dc2626" font-size="10" font-weight="bold">No</text>
  <!-- A2.1 -> A2.2 -->
  <path d="M 385 340 L 385 255" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- A2.2 -> End A2 -->
  <path d="M 320 232 L 282 232" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- D1 Yes -> S04 -->
  <path d="M 597 605 L 615 605 L 615 365 L 625 365" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="600" y="598" fill="#15803d" font-size="10" font-weight="bold">Yes</text>

  <!-- S04 -> D2 -->
  <path d="M 690 390 L 690 565" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- D2 No (Misuse) -> A3.1 -->
  <path d="M 630 605 L 540 605 L 540 390" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="575" y="598" fill="#dc2626" font-size="10" font-weight="bold">No</text>
  <!-- A3.1 -> A3.2 -->
  <path d="M 540 340 L 540 255" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- A3.2 -> End A3 -->
  <path d="M 605 232 L 603 232" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- D2 Yes -> S05 -->
  <path d="M 750 605 L 775 605" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="755" y="598" fill="#15803d" font-size="10" font-weight="bold">Yes</text>

  <!-- S05 -> D3 -->
  <path d="M 837 630 L 837 680" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- D3 No -> A1.1 -->
  <path d="M 777 715 L 755 715" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="760" y="708" fill="#d97706" font-size="10" font-weight="bold">No</text>
  <!-- A1.1 -> A1.2 -->
  <path d="M 692 690 L 692 495" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- A1.2 -> End A1 -->
  <path d="M 692 450 L 692 198" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- D3 Yes -> S06 -->
  <path d="M 897 715 L 995 715 L 995 390" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="910" y="708" fill="#15803d" font-size="10" font-weight="bold">Yes</text>
  <!-- S06 -> S06.2 (Customer receives part) -->
  <path d="M 995 340 L 995 155" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- S06 -> S07 -->
  <path d="M 1030 390 L 1030 580" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- S07 -> S07.2 -->
  <path d="M 995 580 L 995 255" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- S07.2 -> End Success -->
  <path d="M 995 255 L 995 264" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />

</svg>
